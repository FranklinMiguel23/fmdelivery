<style>
:root{--bg:#f7f9f6;--card:#fff;--tx:#17221d;--mu:#5a6862;--ac:#c8102e;--bd:#e0e6e1;--soft:#fdeaea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1412;--card:#19201d;--tx:#e9eeea;--mu:#9baba3;--ac:#ff6b6b;--bd:#2c3631;--soft:#3a1a1d}}
:root[data-theme="dark"]{--bg:#0f1412;--card:#19201d;--tx:#e9eeea;--mu:#9baba3;--ac:#ff6b6b;--bd:#2c3631;--soft:#3a1a1d}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.w{max-width:1000px;margin:auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--bd);z-index:8}
header .w{display:flex;justify-content:space-between;align-items:center;height:58px;gap:10px}
.logo{font-weight:800;font-size:18px}.hr{display:flex;align-items:center;gap:10px}
.pl{color:var(--ac);font-weight:700;font-size:14px;text-decoration:none}
.lang button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:5px 10px;border-radius:7px;font:inherit;font-size:13px}
.lang button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.hero{background:linear-gradient(135deg,#c8102e,#8e0b21 55%,#4a0a14);color:#fff;overflow:hidden}
.hero .w{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;padding-top:44px;padding-bottom:44px}
@media(max-width:760px){.hero .w{grid-template-columns:1fr}}
.tag{display:inline-block;background:rgba(255,255,255,.16);font-weight:600;font-size:13px;padding:4px 12px;border-radius:99px}
h1{font-size:clamp(30px,6vw,50px);line-height:1.08;margin:14px 0}
.lead{opacity:.92;font-size:18px;max-width:520px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-block;padding:12px 20px;border-radius:10px;background:#ffd54a;color:#1c2b1f;text-decoration:none;font-weight:800;border:0;font-size:16px;font-family:inherit;cursor:pointer}
.btn.o{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.7)}
.art{width:100%;height:auto;max-height:300px}.rid{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.feat{margin-top:-26px}.feat .g{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
section{padding:34px 0}
h2{font-size:27px;margin:0 0 6px}.sd{color:var(--mu);margin:0 0 18px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.c h3{margin:10px 0 4px;font-size:17px}.c p{margin:0;color:var(--mu)}
.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib{width:46px;height:46px;border-radius:12px;background:var(--soft);color:var(--ac);display:grid;place-items:center}
.n{width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:800}
.form{max-width:560px}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:0 0 10px}
.fb{background:#25d366;color:#fff;width:100%}
.err{color:#c0392b;font-size:14px;min-height:20px}
details{border-top:1px solid var(--bd);padding:12px 0}details:first-of-type{border-top:0}
summary{font-weight:700;cursor:pointer}details p{margin:8px 0 0;color:var(--mu)}
.cta{background:linear-gradient(135deg,#c8102e,#5a0b17);color:#fff;border-radius:20px;padding:34px 22px;text-align:center}
.cta p{opacity:.92}
.cp{display:inline-block;border:1px solid #fff;background:transparent;color:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;text-decoration:none;cursor:pointer}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#25d366;color:#fff;padding:12px 18px;border-radius:99px;font-weight:700;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.28);z-index:9;display:none}
footer{padding:26px 0 90px;color:var(--mu);font-size:13px;text-align:center}
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.rid{animation:none}}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.gal img{width:100%;border-radius:16px;display:block}
</style>
